plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pdftools'
version = '0.1.0'

android {
  namespace "expo.modules.pdftools"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Apache-2.0 port of Apache PDFBox for Android: merge/split/watermark/image recompression.
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
